name: Android builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies and sync Capacitor
        # VITE_API_URL comes from the committed .env.production (public backend
        # origin), so no repository variable is required to build a working APK.
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pharmachain-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pharmachain-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK and Play Store bundle
        if: env.ANDROID_RELEASE_SIGNING == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.${{ github.run_number }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK and bundle
        uses: actions/upload-artifact@v4
        with:
          name: pharmachain-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
